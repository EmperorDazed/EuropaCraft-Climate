<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EuropaCraft Weather Simulator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #101418;
            color: #e8edf1;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        button,
        select,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* ================================================================
           HEADER
           ================================================================ */

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 13px 18px;

            background: #171d22;

            border-bottom:
                1px solid #303941;
        }

        #title-area {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        #main-title {
            margin: 0;

            font-size: 20px;
            font-weight: 700;

            letter-spacing: 0.2px;
        }

        #subtitle {
            color: #9eabb5;

            font-size: 12px;
        }

        #status-area {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 12px;
        }

        #status-dot {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: #d5a93a;
        }

        #status-text {
            color: #bfc8cf;
        }


        /* ================================================================
           MAIN
           ================================================================ */

        #app {
            width: 100%;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                300px;

            min-height:
                calc(100vh - 57px);
        }


        /* ================================================================
           LEFT / MAP
           ================================================================ */

        #map-section {
            min-width: 0;

            padding: 12px;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        /* ================================================================
           CONTROL TOOLBAR
           ================================================================ */

        #toolbar {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;

            padding: 8px;

            background: #171d22;

            border:
                1px solid #303941;

            border-radius: 6px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-separator {
            width: 1px;
            height: 27px;

            background: #344049;

            margin:
                0 4px;
        }

        .button {
            border:
                1px solid #3d4851;

            background: #222a30;
            color: #e6ebef;

            border-radius: 4px;

            padding:
                6px 10px;

            min-height: 32px;
        }

        .button:hover {
            background: #2c363e;
        }

        .button.active {
            background: #36546b;

            border-color: #5d8099;
        }

        .button.danger {
            background: #4a292c;

            border-color: #6b3b40;
        }

        select,
        input[type="number"],
        input[type="datetime-local"],
        input[type="text"] {
            border:
                1px solid #3d4851;

            background: #20272c;
            color: #e8edf1;

            border-radius: 4px;

            padding:
                6px 7px;
        }

        select {
            min-height: 32px;
        }


        /* ================================================================
           MAP CONTAINER
           ================================================================ */

        #map-container {
            position: relative;

            width: 100%;

            background: #080b0d;

            border:
                1px solid #303941;

            border-radius: 6px;

            overflow: hidden;

            line-height: 0;
        }

        #weather-map {
            display: block;

            width: 100%;
            height: auto;

            image-rendering: auto;
        }


        /* ================================================================
           MAP LABELS
           ================================================================ */

        #layer-label {
            position: absolute;

            top: 9px;
            left: 10px;

            padding:
                5px 7px;

            background:
                rgba(
                    10,
                    14,
                    17,
                    0.72
                );

            border-radius: 4px;

            font-size: 12px;
            line-height: normal;

            pointer-events: none;
        }

        #time-label {
            position: absolute;

            top: 9px;
            right: 10px;

            padding:
                5px 7px;

            background:
                rgba(
                    10,
                    14,
                    17,
                    0.72
                );

            border-radius: 4px;

            font-size: 12px;
            line-height: normal;

            pointer-events: none;
        }


        /* ================================================================
           HOVER
           ================================================================ */

        #hover-panel {
            position: absolute;

            display: none;

            min-width: 185px;

            padding: 8px;

            background:
                rgba(
                    10,
                    14,
                    17,
                    0.92
                );

            border:
                1px solid #50606c;

            border-radius: 5px;

            line-height: 1.35;

            font-size: 11px;

            pointer-events: none;

            z-index: 20;
        }

        #hover-panel strong {
            font-size: 13px;
        }


        /* ================================================================
           TIMELINE
           ================================================================ */

        #timeline-panel {
            padding: 9px;

            background: #171d22;

            border:
                1px solid #303941;

            border-radius: 6px;
        }

        #timeline-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;

            margin-bottom: 8px;
        }

        #timeline-date {
            font-size: 13px;
            font-weight: 600;
        }

        #timeline-subtext {
            font-size: 11px;
            color: #98a5ae;
        }

        #timeline-controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }


        /* ================================================================
           SIDE PANEL
           ================================================================ */

        #sidebar {
            border-left:
                1px solid #303941;

            background: #14191d;

            padding: 11px;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel {
            background: #1a2025;

            border:
                1px solid #303941;

            border-radius: 6px;

            padding: 10px;
        }

        .panel-title {
            margin:
                0 0 9px 0;

            font-size: 13px;
            font-weight: 700;
        }

        .data-grid {
            display: grid;

            grid-template-columns:
                1fr auto;

            gap:
                5px 10px;

            font-size: 11px;
        }

        .data-name {
            color: #9eabb5;
        }

        .data-value {
            text-align: right;

            font-variant-numeric:
                tabular-nums;
        }


        /* ================================================================
           LAYER BUTTONS
           ================================================================ */

        #layer-buttons {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 5px;
        }

        #layer-buttons .button {
            font-size: 11px;
        }


        /* ================================================================
           OVERLAYS
           ================================================================ */

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            margin-bottom: 7px;

            font-size: 11px;
        }


        /* ================================================================
           STATIONS
           ================================================================ */

        #station-form {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 5px;
        }

        #station-name {
            grid-column:
                1 / -1;
        }

        #add-station-button {
            grid-column:
                1 / -1;
        }

        #station-list {
            margin-top: 8px;

            display: flex;
            flex-direction: column;
            gap: 4px;

            max-height: 170px;

            overflow-y: auto;
        }

        .station-item {
            padding: 6px;

            background: #20272c;

            border-radius: 4px;

            font-size: 11px;
        }


        /* ================================================================
           SYSTEM INFO
           ================================================================ */

        #system-message {
            white-space: pre-wrap;

            max-height: 180px;

            overflow-y: auto;

            font-family:
                Consolas,
                monospace;

            font-size: 10px;

            color: #aeb9c1;
        }


        /* ================================================================
           RESPONSIVE
           ================================================================ */

        @media (
            max-width: 1050px
        ) {

            #app {
                grid-template-columns:
                    1fr;
            }

            #sidebar {
                border-left: none;

                border-top:
                    1px solid #303941;

                display: grid;

                grid-template-columns:
                    repeat(
                        2,
                        minmax(
                            0,
                            1fr
                        )
                    );
            }
        }

        @media (
            max-width: 650px
        ) {

            #sidebar {
                grid-template-columns:
                    1fr;
            }

            #header {
                align-items: flex-start;

                flex-direction: column;
            }
        }

    </style>
</head>


<body>


    <!-- ================================================================
         HEADER
         ================================================================ -->

    <header id="header">

        <div id="title-area">

            <h1 id="main-title">
                EuropaCraft Weather Simulator
            </h1>

            <div id="subtitle">
                Persistent European atmosphere
            </div>

        </div>


        <div id="status-area">

            <div id="status-dot"></div>

            <span id="status-text">
                Loading simulation…
            </span>

        </div>

    </header>


    <!-- ================================================================
         APPLICATION
         ================================================================ -->

    <main id="app">


        <!-- ============================================================
             MAP SIDE
             ============================================================ -->

        <section id="map-section">


            <!-- ========================================================
                 TOOLBAR
                 ======================================================== -->

            <div id="toolbar">

                <div class="toolbar-group">

                    <button
                        id="play-button"
                        class="button"
                        type="button"
                    >
                        ▶ Play
                    </button>

                    <button
                        id="step-button"
                        class="button"
                        type="button"
                    >
                        +4 min
                    </button>

                </div>


                <div class="toolbar-separator"></div>


                <div class="toolbar-group">

                    <label for="speed-select">
                        Speed
                    </label>

                    <select id="speed-select">

                        <option value="1">
                            Real time
                        </option>

                        <option
                            value="60"
                            selected
                        >
                            1 min/sec
                        </option>

                        <option value="600">
                            10 min/sec
                        </option>

                        <option value="3600">
                            1 hour/sec
                        </option>

                        <option value="21600">
                            6 hours/sec
                        </option>

                        <option value="86400">
                            1 day/sec
                        </option>

                    </select>

                </div>


                <div class="toolbar-separator"></div>


                <div class="toolbar-group">

                    <button
                        id="minus-hour-button"
                        class="button"
                        type="button"
                    >
                        −1h
                    </button>

                    <button
                        id="plus-hour-button"
                        class="button"
                        type="button"
                    >
                        +1h
                    </button>

                    <button
                        id="minus-day-button"
                        class="button"
                        type="button"
                    >
                        −1d
                    </button>

                    <button
                        id="plus-day-button"
                        class="button"
                        type="button"
                    >
                        +1d
                    </button>

                </div>


                <div class="toolbar-separator"></div>


                <div class="toolbar-group">

                    <button
                        id="snapshot-button"
                        class="button"
                        type="button"
                    >
                        Snapshot
                    </button>

                </div>

            </div>


            <!-- ========================================================
                 MAP
                 ======================================================== -->

            <div id="map-container">

                <canvas
                    id="weather-map"
                    width="780"
                    height="440"
                ></canvas>


                <div id="layer-label">
                    Actual temperature
                </div>


                <div id="time-label">
                    —
                </div>


                <div id="hover-panel"></div>

            </div>


            <!-- ========================================================
                 TIMELINE
                 ======================================================== -->

            <div id="timeline-panel">

                <div id="timeline-top">

                    <div>

                        <div id="timeline-date">
                            —
                        </div>

                        <div id="timeline-subtext">
                            Physics timestep: —
                        </div>

                    </div>


                    <input
                        id="datetime-input"
                        type="datetime-local"
                        step="60"
                    >

                </div>


                <div id="timeline-controls">

                    <button
                        id="seek-button"
                        class="button"
                        type="button"
                    >
                        Go to time
                    </button>

                    <button
                        id="now-reset-button"
                        class="button"
                        type="button"
                    >
                        Reset simulation
                    </button>

                </div>

            </div>

        </section>


        <!-- ============================================================
             SIDEBAR
             ============================================================ -->

        <aside id="sidebar">


            <!-- ========================================================
                 CURRENT STATE
                 ======================================================== -->

            <section class="panel">

                <h2 class="panel-title">
                    Simulation
                </h2>


                <div class="data-grid">

                    <span class="data-name">
                        Physics step
                    </span>

                    <span
                        class="data-value"
                        id="info-step"
                    >
                        —
                    </span>


                    <span class="data-name">
                        Total steps
                    </span>

                    <span
                        class="data-value"
                        id="info-total-steps"
                    >
                        —
                    </span>


                    <span class="data-name">
                        Systems
                    </span>

                    <span
                        class="data-value"
                        id="info-systems"
                    >
                        —
                    </span>


                    <span class="data-name">
                        Steering arrows
                    </span>

                    <span
                        class="data-value"
                        id="info-arrows"
                    >
                        —
                    </span>


                    <span class="data-name">
                        Snapshots
                    </span>

                    <span
                        class="data-value"
                        id="info-snapshots"
                    >
                        —
                    </span>


                    <span class="data-name">
                        Render time
                    </span>

                    <span
                        class="data-value"
                        id="info-render"
                    >
                        —
                    </span>

                </div>

            </section>


            <!-- ========================================================
                 MAP LAYERS
                 ======================================================== -->

            <section class="panel">

                <h2 class="panel-title">
                    Map Layer
                </h2>


                <div id="layer-buttons">

                    <button
                        class="button active"
                        data-layer="temperature"
                        type="button"
                    >
                        Temperature
                    </button>

                    <button
                        class="button"
                        data-layer="anomaly"
                        type="button"
                    >
                        Anomaly
                    </button>

                    <button
                        class="button"
                        data-layer="pressure"
                        type="button"
                    >
                        Pressure
                    </button>

                    <button
                        class="button"
                        data-layer="wind"
                        type="button"
                    >
                        Wind
                    </button>

                    <button
                        class="button"
                        data-layer="cloud"
                        type="button"
                    >
                        Cloud
                    </button>

                    <button
                        class="button"
                        data-layer="precipitation"
                        type="button"
                    >
                        Precipitation
                    </button>

                    <button
                        class="button"
                        data-layer="snow"
                        type="button"
                    >
                        Snow
                    </button>

                    <button
                        class="button"
                        data-layer="sst"
                        type="button"
                    >
                        SST
                    </button>

                    <button
                        class="button"
                        data-layer="fronts"
                        type="button"
                    >
                        Fronts
                    </button>

                </div>

            </section>


            <!-- ========================================================
                 OVERLAYS
                 ======================================================== -->

            <section class="panel">

                <h2 class="panel-title">
                    Overlays
                </h2>


                <label class="toggle-row">

                    <span>
                        Isobars
                    </span>

                    <input
                        id="isobar-toggle"
                        type="checkbox"
                        checked

                </label>


                <label class="toggle-row">

                    <span>
                        Wind vectors
                    </span>

                    <input
                        id="wind-vector-toggle"
                        type="checkbox"
                    >

                </label>


                <label class="toggle-row">

                    <span>
                        Front overlay
                    </span>

                    <input
                        id="front-toggle"
                        type="checkbox"
                    >

                </label>


                <label class="toggle-row">

                    <span>
                        Synoptic systems
                    </span>

                    <input
                        id="system-toggle"
                        type="checkbox"
                        checked
                    >

                </label>


                <label class="toggle-row">

                    <span>
                        Steering arrows
                    </span>

                    <input
                        id="arrow-toggle"
                        type="checkbox"
                        checked
                    >

                </label>

            </section>


            <!-- ========================================================
                 WEATHER STATIONS
                 ======================================================== -->

            <section class="panel">

                <h2 class="panel-title">
                    Weather Stations

                <div id="station-form">

                    <input
                        id="station-name"
                        type="text"
                        placeholder="Station name"
                    >


                    <input
                        id="station-lat"
                        type="number"
                        step="0.01"
                        min="30"
                        max="74"
                        value="51.27"
                        placeholder="Latitude"
                    >


                    <input
                        id="station-lon"
                        type="number"
                        step="0.01"
                        min="-26"
                        max="52"
                        value="0.52"
                        placeholder="Longitude"
                    >


                    <button
                        id="add-station-button"
                        class="button"
                        type="button"
                    >
                        Add Station
                    </button>

                </div>


                <div id="station-list"></div>

            </section>


            <!-- ========================================================
                 DIAGNOSTICS
                 ======================================================== -->

            <section class="panel">

                <h2 class="panel-title">
                    Diagnostics
                </h2>


                <div id="system-message">
                    Waiting for simulator…
                </div>

            </section>

        </aside>

    </main>


    <!-- ================================================================
         EUROPAcraft WEATHER MODULES

         LOAD ORDER IS IMPORTANT.

         null1.js IS INTENTIONALLY NOT LOADED.
         ================================================================ -->


    <script src="config.js"></script>

    <script src="europacraft-utils.js"></script>

    <script src="europacraft-terrain.js"></script>

    <script src="europacraft-climate-v3.js"></script>

    <script src="europacraft-ocean.js"></script>

    <script src="europacraft-synoptic.js"></script>

    <script src="europacraft-atmosphere.js"></script>

    <script src="europacraft-physics.js"></script>

    <script src="europacraft-history.js"></script>

    <script src="europacraft-weather.js"></script>

    <script src="europacraft-renderer.js"></script>


    <!-- ================================================================
         APPLICATION BOOT
         ================================================================ -->

    <script>

    (function () {
    "use strict";


    /* ====================================================================
       ELEMENTS
       ==================================================================== */

    const $ = id =>
        document.getElementById(
            id
        );


    const statusDot =
        $("status-dot");

    const statusText =
        $("status-text");

    const diagnostics =
        $("system-message");


    let weather = null;

    let renderer = null;


    /* ====================================================================
       STATUS
       ==================================================================== */

    function setStatus(
        text,
        state = "loading"
    ) {

        statusText.textContent = (
            text
        );


        if (
            state ===
            "good"
        ) {

            statusDot.style.background = (
                "#4db878"
            );
        }

        else if (
            state ===
            "bad"
        ) {

            statusDot.style.background = (
                "#d95c5c"
            );
        }

        else {

            statusDot.style.background = (
                "#d5a93a"
            );
        }
    }


    function log(
        text
    ) {

        diagnostics.textContent = (
            text
        );
    }


    /* ====================================================================
       DATE DISPLAY
       ==================================================================== */

    function formatDate(
        date
    ) {

        return new Intl.DateTimeFormat(

            "en-GB",

            {
                year:
                    "numeric",

                month:
                    "short",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false,

                timeZone:
                    "UTC"
            }

        ).format(
            date
        ) + " UTC";
    }


    function localInputValue(
        date
    ) {

        function pad(
            value
        ) {

            return String(
                value
            ).padStart(
                2,
                "0"
            );
        }


        return (

            date.getUTCFullYear() +
            "-" +

            pad(
                date.getUTCMonth() +
                1
            ) +
            "-" +

            pad(
                date.getUTCDate()
            ) +
            "T" +

            pad(
                date.getUTCHours()
            ) +
            ":" +

            pad(
                date.getUTCMinutes()
            )
        );
    }


    function dateFromInput(
        value
    ) {

        if (
            !value
        ) {

            return null;
        }


        const parts = (
            value.split(
                "T"
            )
        );


        if (
            parts.length !==
            2
        ) {

            return null;
        }


        const dateParts = (
            parts[0]
                .split(
                    "-"
                )
                .map(
                    Number
                )
        );


        const timeParts = (
            parts[1]
                .split(
                    ":"
                )
                .map(
                    Number
                )
        );


        if (
            dateParts.length <
            3 ||
            timeParts.length <
            2
        ) {

            return null;
        }


        return new Date(

            Date.UTC(

                dateParts[0],

                dateParts[1] - 1,

                dateParts[2],

                timeParts[0],

                timeParts[1],

                0,

                0
            )
        );
    }


    /* ====================================================================
       STATE DISPLAY
       ==================================================================== */

    function updateInformation() {

        if (
            !weather ||
            !renderer
        ) {

            return;
        }


        const state = (
            weather.getStateSummary()
        );


        const renderInfo = (
            renderer.getInfo()
        );


        $("time-label").textContent = (
            formatDate(
                state.date
            )
        );


        $("timeline-date").textContent = (
            formatDate(
                state.date
            )
        );


        $("timeline-subtext").textContent = (

            "Physics timestep: " +
            state.physicsStepMinutes +
            " minutes"
        );


        $("datetime-input").value = (
            localInputValue(
                state.date
            )
        );


        $("info-step").textContent = (

            state.physicsStepMinutes +
            " min"
        );


        $("info-total-steps").textContent = (
            state.totalPhysicsSteps
        );


        $("info-systems").textContent = (
            state.systems
        );


        $("info-arrows").textContent = (
            state.steeringArrows
        );


        $("info-snapshots").textContent = (
            state.snapshots
        );


        $("info-render").textContent = (

            renderInfo.lastRenderMs.toFixed(
                1
            ) +
            " ms"
        );


        $("play-button").textContent = (

            state.playing
                ? "❚❚ Pause"
                : "▶ Play"
        );


        $("play-button").classList.toggle(

            "active",

            state.playing
        );
    }


    /* ====================================================================
       RENDER
       ==================================================================== */

    function redraw() {

        if (
            !renderer
        ) {

            return;
        }


        renderer.render();

        updateInformation();
    }


    /* ====================================================================
       HOVER
       ==================================================================== */

    function configureHover() {

        renderer.options.onHover = data => {

            const panel = (
                $("hover-panel")
            );


            if (
                !data ||
                !data.sample
            ) {

                panel.style.display = (
                    "none"
                );


                return;
            }


            const sample = (
                data.sample
            );


            const temperature = (
                Number(
                    sample.temperatureC
                )
            );


            const anomaly = (
                Number(
                    sample.anomalyC
                )
            );


            const pressure = (
                Number(
                    sample.pressureHpa
                )
            );


            const wind = (
                Number(
                    sample.windSpeed
                )
            );


            const rh = (

                Number(
                    sample.relativeHumidity
                ) *
                100
            );


            const precip = (
                Number(
                    sample.precipRateMmHr
                )
            );


            const snow = (
                Number(
                    sample.snowDepthCm
                )
            );


            panel.innerHTML = (

                "<strong>" +

                data.lat.toFixed(
                    2
                ) +

                "°N, " +

                data.lon.toFixed(
                    2
                ) +

                "°</strong>" +

                "<br>" +

                "Temperature: " +

                temperature.toFixed(
                    1
                ) +

                " °C" +

                "<br>" +

                "Anomaly: " +

                (
                    anomaly >= 0
                        ? "+"
                        : ""
                ) +

                anomaly.toFixed(
                    1
                ) +

                " °C" +

                "<br>" +

                "Pressure: " +

                pressure.toFixed(
                    0
                ) +

                " hPa" +

                "<br>" +

                "Humidity: " +

                rh.toFixed(
                    0
                ) +

                "%" +

                "<br>" +

                "Wind: " +

                wind.toFixed(
                    1
                ) +

                " m/s" +

                "<br>" +

                "Precip: " +

                precip.toFixed(
                    2
                ) +

                " mm/h" +

                "<br>" +

                "Snow: " +

                snow.toFixed(
                    1
                ) +

                " cm"
            );


            panel.style.display = (
                "block"
            );


            let left = (
                data.x +
                14
            );


            let top = (
                data.y +
                14
            );


            if (
                left >
                renderer.width -
                205
            ) {

                left = (
                    data.x -
                    200
                );
            }


            if (
                top >
                renderer.height -
                165
            ) {

                top = (
                    data.y -
                    160
                );
            }


            panel.style.left = (
                left +
                "px"
            );


            panel.style.top = (
                top +
                "px"
            );
        };
    }


    /* ====================================================================
       LAYERS
       ==================================================================== */

    const layerNames = {

        temperature:
            "Actual temperature",

        anomaly:
            "Temperature anomaly",

        pressure:
            "Sea-level pressure",

        wind:
            "Wind speed",

        cloud:
            "Cloud",

        precipitation:
            "Precipitation",

        snow:
            "Snow depth",

        sst:
            "Sea-surface temperature",

        fronts:
            "Front strength"
    };


    function configureLayers() {

        const buttons = (
            document.querySelectorAll(
                "[data-layer]"
            )
        );


        buttons.forEach(
            button => {

                button.addEventListener(

                    "click",

                    () => {

                        const layer = (
                            button.dataset.layer
                        );


                        renderer.setLayer(
                            layer
                        );


                        buttons.forEach(
                            other => {

                                other.classList.toggle(

                                    "active",

                                    other ===
                                    button
                                );
                            }
                        );


                        $("layer-label").textContent = (

                            layerNames[layer] ||
                            layer
                        );


                        updateInformation();
                    }
                );
            }
        );
    }


    /* ====================================================================
       PLAYBACK
       ==================================================================== */

    function configurePlayback() {

        $("play-button").addEventListener(

            "click",

            () => {

                weather.togglePlay();

                updateInformation();
            }
        );


        $("step-button").addEventListener(

            "click",

            () => {

                weather.step();

                redraw();
            }
        );


        $("speed-select").addEventListener(

            "change",

            event => {

                weather.setTimeScale(

                    Number(
                        event.target.value
                    )
                );


                updateInformation();
            }
        );


        $("minus-hour-button").addEventListener(

            "click",

            () => {

                weather.seekHours(
                    -1
                );


                redraw();
            }
        );


        $("plus-hour-button").addEventListener(

            "click",

            () => {

                weather.seekHours(
                    1
                );


                redraw();
            }
        );


        $("minus-day-button").addEventListener(

            "click",

            () => {

                weather.seekDays(
                    -1
                );


                redraw();
            }
        );


        $("plus-day-button").addEventListener(

            "click",

            () => {

                weather.seekDays(
                    1
                );


                redraw();
            }
        );


        $("snapshot-button").addEventListener(

            "click",

            () => {

                weather.saveSnapshot();

                updateInformation();
            }
        );


        $("seek-button").addEventListener(

            "click",

            () => {

                const date = (
                    dateFromInput(
                        $("datetime-input").value
                    )
                );


                if (
                    !date
                ) {

                    return;
                }


                weather.seek(
                    date
                );


                redraw();
            }
        );


        $("now-reset-button").addEventListener(

            "click",

            () => {

                weather.reset(
                    new Date()
                );


                redraw();
            }
        );
    }


    /* ====================================================================
       OVERLAYS
       ==================================================================== */

    function configureOverlays() {

        $("isobar-toggle").addEventListener(

            "change",

            event => {

                renderer.setIsobars(
                    event.target.checked
                );
            }
        );


        $("wind-vector-toggle").addEventListener(

            "change",

            event => {

                renderer.setWindVectors(
                    event.target.checked
                );
            }
        );


        $("front-toggle").addEventListener(

            "change",

            event => {

                renderer.setFrontOverlay(
                    event.target.checked
                );
            }
        );


        $("system-toggle").addEventListener(

            "change",

            event => {

                renderer.setSystemMarkers(
                    event.target.checked
                );
            }
        );


        $("arrow-toggle").addEventListener(

            "change",

            event => {

                renderer.setSteeringArrows(
                    event.target.checked
                );
            }
        );
    }


    /* ====================================================================
       STATIONS
       ==================================================================== */

    function updateStationList() {

        const list = (
            $("station-list")
        );


        list.innerHTML = "";


        const stations = (
            weather.getStations()
        );


        for (
            const station
            of stations
        ) {

            const item = (
                document.createElement(
                    "div"
                )
            );


            item.className = (
                "station-item"
            );


            const latest = (
                station.sampleAt(
                    weather.getDate()
                )
            );


            let text = (

                station.name +
                " — " +

                station.lat.toFixed(
                    2
                ) +

                ", " +

                station.lon.toFixed(
                    2
                )
            );


            if (
                latest &&
                Number.isFinite(
                    latest.temperatureC
                )
            ) {

                text += (

                    " — " +

                    latest.temperatureC.toFixed(
                        1
                    ) +

                    " °C"
                );
            }


            item.textContent = (
                text
            );


            list.appendChild(
                item
            );
        }
    }


    function configureStations() {

        $("add-station-button").addEventListener(

            "click",

            () => {

                const name = (

                    $("station-name").value.trim() ||
                    null
                );


                const lat = Number(
                    $("station-lat").value
                );


                const lon = Number(
                    $("station-lon").value
                );


                if (
                    !Number.isFinite(
                        lat
                    ) ||
                    !Number.isFinite(
                        lon
                    )
                ) {

                    return;
                }


                weather.addStation(

                    lat,

                    lon,

                    name
                );


                $("station-name").value = "";


                updateStationList();

                updateInformation();
            }
        );
    }


    /* ====================================================================
       WEATHER EVENTS
       ==================================================================== */

    function configureWeatherEvents() {

        weather.on(

            "frame",

            () => {

                renderer.render();

                updateInformation();

                updateStationList();
            }
        );


        weather.on(

            "step",

            () => {

                updateInformation();

                updateStationList();
            }
        );


        weather.on(

            "seek",

            () => {

                updateInformation();

                updateStationList();
            }
        );


        weather.on(

            "reset",

            () => {

                updateInformation();

                updateStationList();
            }
        );
    }


    /* ====================================================================
       BOOT CHECK
       ==================================================================== */

    function checkModules() {

        const modules = [

            [
                "EuropaConfig",
                window.EuropaConfig
            ],

            [
                "EuropaUtils",
                window.EuropaUtils
            ],

            [
                "EuropaTerrain",
                window.EuropaTerrain
            ],

            [
                "EuropaClimate",
                window.EuropaClimate
            ],

            [
                "EuropaOcean",
                window.EuropaOcean
            ],

            [
                "EuropaSynoptic",
                window.EuropaSynoptic
            ],

            [
                "EuropaAtmosphere",
                window.EuropaAtmosphere
            ],

            [
                "EuropaPhysics",
                window.EuropaPhysics
            ],

            [
                "EuropaHistory",
                window.EuropaHistory
            ],

            [
                "EuropaWeather",
                window.EuropaWeather
            ],

            [
                "EuropaRenderer",
                window.EuropaRenderer
            ]
        ];


        const missing = (
            modules
                .filter(
                    entry =>
                        !entry[1]
                )
                .map(
                    entry =>
                        entry[0]
                )
        );


        if (
            missing.length >
            0
        ) {

            throw new Error(

                "Missing modules: " +
                missing.join(
                    ", "
                )
            );
        }
    }


    /* ====================================================================
       GLOBAL ERROR DISPLAY
       ==================================================================== */

    window.addEventListener(

        "error",

        event => {

            setStatus(
                "Simulation error",
                "bad"
            );


            log(

                "JavaScript error\n\n" +

                (
                    event.message ||
                    "Unknown error"
                ) +

                "\n\n" +

                (
                    event.filename ||
                    ""
                ) +

                ":" +

                (
                    event.lineno ||
                    ""
                )
            );
        }
    );


    window.addEventListener(

        "unhandledrejection",

        event => {

            setStatus(
                "Simulation error",
                "bad"
            );


            log(

                "Unhandled error\n\n" +

                String(
                    event.reason
                )
            );
        }
    );


    /* ====================================================================
       START
       ==================================================================== */

    function boot() {

        try {

            setStatus(
                "Checking modules…",
                "loading"
            );


            checkModules();


            setStatus(
                "Building terrain and atmosphere…",
                "loading"
            );


            weather = (
                window.EuropaWeather.create({

                    startDate:
                        new Date(),

                    seed:
                        20261001,

                    timeScale:
                        60,

                    maxPhysicsStepsPerFrame:
                        24
                })
            );


            renderer = (
                new window.EuropaRenderer(

                    weather,

                    "weather-map",

                    {
                        width:
                            window.EuropaConfig.display
                                ? window.EuropaConfig.display.width
                                : 780,

                        height:
                            window.EuropaConfig.display
                                ? window.EuropaConfig.display.height
                                : 440,

                        layer:
                            "temperature",

                        isobars:
                            true,

                        windVectors:
                            false,

                        frontOverlay:
                            false,

                        steeringArrows:
                            true,

                        systems:
                            true,

                        autoRender:
                            false
                    }
                )
            );


            configureHover();

            configureLayers();

            configurePlayback();

            configureOverlays();

            configureStations();

            configureWeatherEvents();


            /*
             * A few useful starter stations.
             */

            weather.addStation(

                51.27,

                0.52,

                "Maidstone"
            );


            weather.addStation(

                60.05,

                -19.95,

                "EuropaCraft Spawn"
            );


            weather.addStation(

                54.35,

                18.65,

                "Gdańsk"
            );


            weather.addStation(

                43.51,

                16.44,

                "Split"
            );


            weather.addStation(

                45.81,

                15.98,

                "Zagreb"
            );


            weather.addStation(

                46.77,

                23.59,

                "Transylvania"
            );


            renderer.render();


            updateStationList();

            updateInformation();


            setStatus(
                "Simulation ready",
                "good"
            );


            log(

                "EuropaCraft Weather " +
                window.EuropaWeather.version +

                "\n\n" +

                "Physics grid: " +

                weather.nx +
                " × " +
                weather.ny +

                "\n" +

                "Physics timestep: " +

                weather.getPhysicsStepMinutes() +
                " minutes" +

                "\n" +

                "Display grid: " +

                renderer.width +
                " × " +
                renderer.height +

                "\n\n" +

                "Persistent atmosphere initialized."
            );


            /*
             * Expose instances for browser console testing.
             */

            window.europaWeather = (
                weather
            );


            window.europaRenderer = (
                renderer
            );

        }

        catch (
            error
        ) {

            console.error(
                error
            );


            setStatus(
                "Startup failed",
                "bad"
            );


            log(

                "EuropaCraft failed to start.\n\n" +

                (
                    error &&
                    error.stack
                        ? error.stack
                        : String(
                            error
                        )
                )
            );
        }
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(

            "DOMContentLoaded",

            boot
        );
    }

    else {

        boot();
    }


    })();

    </script>

</body>
</html>
